name: Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t instagram-telegram-bot .

    - name: Test Docker image
      run: |
        docker run --rm instagram-telegram-bot python -c "import telegram; import instaloader; print('Dependencies OK')"
